[package]
name = "Patternmania"
version = "0.3.0"
description = "Simple five-lane pattern editor with Discord export"
authors = ["xdam99"]
edition = "2021"

[lib]
name = "rhythm_pattern_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
